# =============================================================================
# Codemagic Configuration for Kenick VIP (klux-vip)
# =============================================================================
# Tailored for:
# - Monorepo structure with Flutter in ./app
# - Automated iOS build, code signing, and TestFlight deployment
# - Automated Android App Bundle (AAB) release for Google Play
# =============================================================================

workflows:
  # ---------------------------------------------------------------------------
  # 1. iOS TestFlight Release Workflow
  # ---------------------------------------------------------------------------
  ios-release:
    name: Kenick VIP - iOS TestFlight Release
    working_directory: app
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Links the App Store Connect API Key added in Codemagic
    integrations:
      app_store_connect: kenick_api_key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_secrets
      vars:
        BUNDLE_ID: "com.kenick.vip.kenickVip"
        APP_ID: "kenick_vip"

    scripts:
      - name: Create .env Configuration File
        script: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
            echo "Created app/.env from Codemagic ENV_FILE variable"
          elif [ -f ".env.example" ]; then
            echo "Warning: ENV_FILE variable not found, falling back to .env.example"
            cp .env.example .env
          fi

      - name: Set Up iOS Keychain and Signing Certificates
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter Packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods Dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 3)
          case "$LATEST_BUILD" in
            ''|*[!0-9]*) LATEST_BUILD=3 ;;
            *) [ "$LATEST_BUILD" -lt 3 ] && LATEST_BUILD=3 ;;
          esac
          NEXT_BUILD=$((LATEST_BUILD + 1))
          if [ -n "$BUILD_NUMBER" ] && [ "$BUILD_NUMBER" -gt "$NEXT_BUILD" ] 2>/dev/null; then
            NEXT_BUILD=$BUILD_NUMBER
          fi
          echo "Building iOS IPA with build number: $NEXT_BUILD"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - fehkelvink@gmail.com
        notify:
          failure: true
          success: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------------------------------------------------------------------------
  # 2. Android Google Play Release Workflow
  # ---------------------------------------------------------------------------
  android-release:
    name: Kenick VIP - Android Google Play Bundle (AAB)
    working_directory: app
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - app_secrets

    scripts:
      - name: Create .env Configuration File
        script: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
            echo "Created app/.env from Codemagic ENV_FILE variable"
          fi

      - name: Get Flutter Packages
        script: |
          flutter packages pub get

      - name: Build Android App Bundle (.aab)
        script: |
          BUILD_NUM=${BUILD_NUMBER:-4}
          if [ "$BUILD_NUM" -lt 4 ] 2>/dev/null; then
            BUILD_NUM=4
          fi
          echo "Building Android AAB with build number: $BUILD_NUM"
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUM

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - fehkelvink@gmail.com
        notify:
          failure: true
          success: true
